<div class="bg-white rounded-md shadow-lg p-6 w-full max-w-md">
    <h3 class="text-lg font-semibold text-gray-800 mb-4">Delete Key</h3>
    <p class="text-sm text-gray-600 mb-6">
        Are you sure you want to delete <strong>{{ key.tag }}</strong>? This cannot be undone.
    </p>
    <div class="flex justify-end gap-2">
        <label
            for="confirm-toggle"
            class="cursor-pointer px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100"
        >
            Cancel
        </label>
        <button
            hx-delete="/keys/{{ key.id }}"
            hx-target="#main-content"
            hx-swap="innerHTML"
            class="bg-red-600 text-white text-sm font-medium px-3 py-2 rounded-md hover:bg-red-700"
        >
            Delete
        </button>
    </div>
</div>
