<div class="bg-white rounded-md shadow-lg p-6 w-full max-w-md">
    <h3 class="text-lg font-semibold text-gray-800 mb-4">Convert to Maintenance Slot</h3>

    <form
        hx-post="/issue-tickets/{{ ticket.id }}/convert"
        hx-target="#modal-content"
        hx-swap="innerHTML"
        class="space-y-3"
    >
        <input type="hidden" name="room_id" value="{{ ticket.room_id }}">

        <div class="bg-gray-50 border border-gray-200 rounded-md px-3 py-2 text-sm text-gray-700">
            Room: {{ ticket.room.code }}
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Start</label>
            <input
                type="datetime-local"
                name="start_date"
                value="{{ values.get('start_date', '') }}"
                class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 text-sm"
            >
            {% if errors.get("start_date") %}
            <p class="text-sm text-red-600 mt-1">{{ errors["start_date"][0] }}</p>
            {% endif %}
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">End</label>
            <input
                type="datetime-local"
                name="end_date"
                value="{{ values.get('end_date', '') }}"
                class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 text-sm"
            >
            {% if errors.get("end_date") %}
            <p class="text-sm text-red-600 mt-1">{{ errors["end_date"][0] }}</p>
            {% endif %}
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Reason</label>
            <input
                type="text"
                name="reason"
                value="{{ values.get('reason', '') or '' }}"
                class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 text-sm"
            >
            {% if errors.get("reason") %}
            <p class="text-sm text-red-600 mt-1">{{ errors["reason"][0] }}</p>
            {% endif %}
        </div>

        <div class="flex justify-end gap-2 pt-2">
            <label
                for="modal-toggle"
                class="cursor-pointer px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100"
            >
                Cancel
            </label>
            <button
                type="submit"
                class="bg-blue-600 text-white text-sm font-medium px-3 py-2 rounded-md hover:bg-blue-700"
            >
                Create Maintenance Slot
            </button>
        </div>
    </form>
</div>
