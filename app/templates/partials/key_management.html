<div>
    <h2 class="text-xl font-semibold text-gray-800 mb-4">Key Management</h2>

    <div class="relative inline-flex rounded-full bg-gray-200 p-1 text-sm mb-4">
        <input type="radio" name="key-mgmt-tab" id="key-mgmt-tab-keys" class="peer/keys hidden" checked
               hx-get="/keys" hx-target="#key-mgmt-content" hx-swap="innerHTML" hx-params="none">
        <input type="radio" name="key-mgmt-tab" id="key-mgmt-tab-authorizations" class="peer/authorizations hidden"
               hx-get="/key-authorizations" hx-target="#key-mgmt-content" hx-swap="innerHTML" hx-params="none">
        <div class="absolute inset-y-1 left-1 w-[61px] rounded-full bg-blue-600 transition-[left,width] duration-200 ease-in-out peer-checked/authorizations:left-[65px] peer-checked/authorizations:w-[119px]"></div>
        <label for="key-mgmt-tab-keys" class="relative z-10 whitespace-nowrap text-center px-4 py-1.5 rounded-full cursor-pointer font-medium peer-checked/keys:text-white text-gray-700 transition-colors">Keys</label>
        <label for="key-mgmt-tab-authorizations" class="relative z-10 whitespace-nowrap text-center px-4 py-1.5 rounded-full cursor-pointer font-medium peer-checked/authorizations:text-white text-gray-700 transition-colors">Authorization</label>
    </div>

    <div id="key-mgmt-content">
        {% include "partials/keys/list.html" %}
    </div>
</div>
