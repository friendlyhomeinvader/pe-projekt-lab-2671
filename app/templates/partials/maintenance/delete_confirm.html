<div class="bg-white rounded-md shadow-lg p-6 w-full max-w-md">
    <h3 class="text-lg font-semibold text-gray-800 mb-4">Delete Maintenance Slot</h3>
    <p class="text-sm text-gray-600 mb-6">
        Are you sure you want to delete the maintenance slot for <strong>{{ slot.room.code }}</strong>
        ({{ slot.start_date.strftime("%Y-%m-%d %H:%M") }}&ndash;{{ slot.end_date.strftime("%Y-%m-%d %H:%M") }})? This cannot be undone.
    </p>
    <div class="flex justify-end gap-2">
        <label
            for="confirm-toggle"
            class="cursor-pointer px-3 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100"
        >
            Cancel
        </label>
        <button
            hx-delete="/maintenance-slots/{{ slot.id }}"
            hx-target="#issue-mgmt-content"
            hx-swap="innerHTML"
            class="bg-red-600 text-white text-sm font-medium px-3 py-2 rounded-md hover:bg-red-700"
        >
            Delete
        </button>
    </div>
</div>
