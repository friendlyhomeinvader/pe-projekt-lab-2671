{% extends "base.html" %}

{% block title %}Keymaster - Log in{% endblock %}

{% block content %}
<div class="flex h-full items-center justify-center">
    <div class="bg-white rounded-md shadow-lg p-6 w-full max-w-md">
        <h3 class="text-lg font-semibold text-gray-800 mb-4">Log in</h3>

        {% if error %}
        <p class="text-sm text-red-600 mb-3">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" class="space-y-3">
            <div>
                <label class="block text-sm font-medium text-gray-700">Username</label>
                <input
                    type="text"
                    name="username"
                    class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 text-sm"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input
                    type="password"
                    name="password"
                    class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2 text-sm"
                >
            </div>

            <div class="flex justify-end pt-2">
                <button
                    type="submit"
                    class="bg-blue-600 text-white text-sm font-medium px-3 py-2 rounded-md hover:bg-blue-700"
                >
                    Log in
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
